name: Daily update

on:
  schedule:
    - cron: "30 7 * * *"   # 07:30 UTC, after the BOE is published (08:30/09:30 Madrid)
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["academic_offers/**", "templates/**", "requirements.txt", ".github/workflows/**"]

permissions:
  contents: write   # commit the updated database
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Scrape and build
        env:
          # Optional. Without it, notices whose posts are only in a PDF annex stay as one "see notice" entry.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ATALAYA_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m academic_offers

      - name: Commit database
        run: |
          git config user.name "atalaya-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offers.db
          git diff --cached --quiet || git commit -m "Daily data update $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
